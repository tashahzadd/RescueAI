services:
  - type: web
    name: rescueai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: rescueai-postgres
          property: connectionString

databases:
  - name: rescueai-postgres
    databaseName: rescueai
    user: rescueai
